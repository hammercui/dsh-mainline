# dsh-mainline bundle patch: inserts this plugin's row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) over dsh-base.
#
# The row is a bare plugin by package name: the host half (exports ".") runs in
# the host process and owns the read-only observation + the /dsh-mainline
# routes, and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client") load in the web GUI.
- insert:
    - id: mainline
      name: dsh-mainline
